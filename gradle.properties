org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# The only place the Core version is declared. `scripts/package_candidate.py` reads this file, and
# the two publish gates in `build.gradle` derive their accepted pattern from the release list
# below, so bumping the version is one edit here rather than a search across the build.
spmCoreVersion=1.3.1
# Release versions this build may publish. Appending one is the deliberate act; the preview form
# `0.1.0-preview.<source SHA12>` is always accepted on top of these.
spmCoreReleaseVersions=1.0.0,1.1.0,1.2.0,1.3.0,1.3.1
