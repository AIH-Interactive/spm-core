dependencies {
    api project(':api')
    implementation project(':format-common')
    implementation project(':format-ysm')
    implementation project(':format-bedrock')
    implementation project(':format-bbmodel')
    implementation project(':format-v3d')
    testImplementation project(':runtime')
    testImplementation project(':native-jni')
    testImplementation project(':render-cpu')
}
tasks.named('test') {
    def nativeLibrary = providers.gradleProperty('spmNativeLibrary')
    if(nativeLibrary.isPresent()) systemProperty 'spm.native.library', nativeLibrary.get()
    def corpus = providers.gradleProperty('spmCorpusDirectory')
    if (corpus.isPresent()) {
        systemProperty 'spm.corpus.directory', corpus.get()
        systemProperty 'spm.corpus.budgetMiB', providers.gradleProperty('spmCorpusBudgetMiB').orElse('512').get()
        // The historical tree is charged at its measured retention cost, so a real community model
        // needs multiple GiB of heap while it is being lowered. This headroom applies to the private
        // corpus run only; the normal unit-test task keeps the default heap.
        maxHeapSize = providers.gradleProperty('spmCorpusHeap').orElse('4g').get()
    }
}
