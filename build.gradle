plugins { id 'base' }

allprojects {
    group = 'dev.spm.core'
    version = providers.gradleProperty('spmCoreVersion').get()
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
        withSourcesJar()
        withJavadocJar()
    }
    dependencyLocking { lockAllConfigurations() }
    tasks.register('resolveDependencies') {
        group = 'verification'
        doLast { configurations.findAll { it.canBeResolved }.each { it.resolve() } }
    }
    tasks.register('writeDependencyInventory') {
        group = 'verification'
        doLast {
            def records = []
            ['runtimeClasspath','testRuntimeClasspath'].each { scope ->
                configurations.named(scope).get().incoming.artifacts.artifacts.each { artifact ->
                    def component = artifact.id.componentIdentifier
                    if (component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
                        records << [group:component.group, name:component.module, version:component.version,
                                    file:artifact.file.name, sha256:sha, scope:scope]
                    }
                }
            }
            def destination = layout.buildDirectory.file('metadata/dependencies.json').get().asFile
            destination.parentFile.mkdirs()
            def buildInputs = new TreeMap<String,String>()
            fileTree(rootDir) {
                include '**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle.lockfile', 'gradle/**', 'gradlew', 'gradlew.bat'
                exclude '**/build/**', '**/target/**', '**/.git/**', '**/.gradle/**', '**/.idea/**', '**/__pycache__/**'
            }.each { input ->
                def relative = rootDir.toPath().relativize(input.toPath()).toString().replace('\\','/')
                buildInputs[relative] = java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString()
            }
            destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([project:project.name, dependencies:records, buildInputs:buildInputs])) + '\n'
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all', '-Werror']
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    tasks.withType(Jar).configureEach {
        manifest.attributes('Automatic-Module-Name': "dev.spm.core.${project.name.replace('-', '')}")
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(providers.gradleProperty('spmTestJavaVersion').orElse('25').get().toInteger())
        }
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
    }
    tasks.named('processResources') {
        from(rootProject.file('LICENSE')) { into 'META-INF/spm-core' }
        from(rootProject.file('NOTICE')) { into 'META-INF/spm-core' }
        from(rootProject.file('THIRD_PARTY_NOTICES.md')) { into 'META-INF/spm-core' }
        from(rootProject.file('provenance')) { into 'META-INF/spm-core/provenance' }
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.12.1')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    publishing {
        repositories {
            if (!(project.name in ['verification', 'integration-tests'])) {
                maven {
                    name = 'candidate'
                    url = rootProject.layout.buildDirectory.dir('candidate-maven')
                }
            }
        }
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = "SPM Core ${project.name}"
                    description = 'Independent host-neutral model runtime and optional Rust acceleration'
                    licenses { license { name = 'MIT License'; url = 'https://opensource.org/licenses/MIT' } }
                }
            }
        }
    }
    tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
        doFirst {
            if (repository.name == 'candidate' && !(project.version.toString() ==~ /0\.1\.0-preview\.[0-9a-f]{12}/)) {
                throw new GradleException('Candidate publication requires -PspmCoreVersion=0.1.0-preview.<source SHA12>')
            }
        }
    }
}
tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
tasks.register('resolveDependencies') {
    group = 'verification'
    description = 'Resolve every resolvable configuration for lock and checksum generation.'
    dependsOn subprojects.collect { it.tasks.named('resolveDependencies') }
}
tasks.register('writeDependencyInventory') {
    group = 'verification'
    dependsOn subprojects.collect { it.tasks.named('writeDependencyInventory') }
}
tasks.register('bundleArtifacts') {
    group = 'build'
    description = 'Build binary/source/javadoc jars and POMs for product modules.'
    dependsOn subprojects.findAll { !(it.name in ['verification','integration-tests']) }.collectMany { p ->
        ['jar','sourcesJar','javadocJar','generatePomFileForMavenJavaPublication'].collect { p.tasks.named(it) }
    }
    dependsOn tasks.named('writeDependencyInventory')
}

tasks.register('sbom') {
    group = 'verification'
    description = 'Generate an SPDX 2.3 SBOM for the current resolved dependency closure and product jars.'
    dependsOn tasks.named('writeDependencyInventory')
    dependsOn subprojects.findAll { !(it.name in ['verification', 'integration-tests']) }.collect { p -> p.tasks.named('jar') }
    doLast {
        def python = providers.environmentVariable('PYTHON').getOrElse('python')
        def revision = providers.exec {
            commandLine 'git', 'rev-parse', 'HEAD'
        }.standardOutput.asText.get().trim()
        if (!(revision ==~ /[0-9a-f]{40}/)) {
            throw new GradleException("Cannot generate an SBOM without an exact 40-hex source revision (got '${revision}')")
        }
        def created = new java.text.SimpleDateFormat('yyyy-MM-dd\'T\'HH:mm:ss\'Z\'')
                .with { it.timeZone = TimeZone.getTimeZone('UTC'); it }.format(new Date())
        def output = layout.buildDirectory.file('reports/sbom.spdx.json').get().asFile
        output.parentFile.mkdirs()
        def result = providers.exec {
            commandLine python, rootProject.file('scripts/sbom.py').absolutePath,
                    '--root', rootDir.absolutePath,
                    '--revision', revision,
                    '--version', project.version.toString(),
                    '--created', created,
                    '--output', output.absolutePath
        }
        logger.lifecycle("SBOM: ${result.standardOutput.asText.get().trim()}")
    }
}

tasks.register('publishCandidate') {
    group = 'publishing'
    description = 'Publish product modules to build/candidate-maven for an immutable preview package.'
    doFirst {
        if (!(project.version.toString() ==~ /0\.1\.0-preview\.[0-9a-f]{12}/)) {
            throw new GradleException('Use -PspmCoreVersion=0.1.0-preview.<exact source commit first 12 hex digits>')
        }
    }
    dependsOn subprojects.findAll { !(it.name in ['verification', 'integration-tests']) }.collect { p ->
        p.tasks.named('publishMavenJavaPublicationToCandidateRepository')
    }
    dependsOn tasks.named('writeDependencyInventory')
}
