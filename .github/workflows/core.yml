name: Independent Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: java-17-linux-x64
            runner: ubuntu-24.04
            java: '17'
            java_arch: x64
            native_target: ''
          - label: java-21-linux-x64
            runner: ubuntu-24.04
            java: '21'
            java_arch: x64
            native_target: ''
          - label: java-25-linux-x64
            runner: ubuntu-24.04
            java: '25'
            java_arch: x64
            native_target: ''
          - label: native-25-linux-x64
            runner: ubuntu-24.04
            java: '25'
            java_arch: x64
            native_target: x86_64-unknown-linux-gnu
          - label: native-25-windows-x64
            runner: windows-2025
            java: '25'
            java_arch: x64
            native_target: x86_64-pc-windows-msvc
          - label: native-25-macos-arm64
            runner: macos-15
            java: '25'
            java_arch: aarch64
            native_target: aarch64-apple-darwin
    steps:
      - name: Check out the exact event SHA (PR merge SHA for pull_request)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python for the mandatory audit and evidence checks
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the actual test JDK
        id: test_jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.java_arch }}
      - name: Install the compiler JDK (always 25, release target remains 17)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: ${{ matrix.java_arch }}
      - name: Execute tests, audit and inspect this candidate
        shell: bash
        env:
          SPM_TEST_JAVA_HOME: ${{ steps.test_jdk.outputs.path }}
          SPM_TEST_JAVA: ${{ matrix.java }}
          SPM_NATIVE_TARGET: ${{ matrix.native_target }}
        run: |
          args=(--expected-sha "$GITHUB_SHA" --test-java "$SPM_TEST_JAVA")
          if [[ -n "$SPM_NATIVE_TARGET" ]]; then
            args+=(--native-target "$SPM_NATIVE_TARGET")
          fi
          python scripts/ci_core.py "${args[@]}"
      - name: Preserve actual logs, XML and candidate files, including on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.label }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .gradle/core-ci/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  core-ci:
    name: Core CI
    needs: candidate
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every candidate row to succeed
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.candidate.result }}
        run: test "$MATRIX_RESULT" = success
      - name: Check out the same exact SHA to assemble the platform matrix
        if: ${{ always() }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python for the platform matrix helper
        if: ${{ always() }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download every candidate manifest
        if: ${{ always() }}
        # A failed row has no verified manifest, so this can legitimately come back empty. The matrix
        # then records that platform as NOT_EXECUTED instead of assuming success.
        continue-on-error: true
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4
        with:
          pattern: core-*-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
      - name: Assemble the native platform matrix from real manifests
        if: ${{ always() }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          args=()
          for manifest in artifacts/**/candidate.json; do
            args+=(--manifest "$manifest")
          done
          python scripts/platform_matrix.py --output platform-matrix.json "${args[@]}"
      - name: Preserve the platform matrix
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-platform-matrix-${{ github.sha }}-${{ github.run_attempt }}
          path: platform-matrix.json
          if-no-files-found: error
          retention-days: 14
