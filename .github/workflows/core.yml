name: Independent Core CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stability:
        description: Run the 30 minute synthetic Core stability soak
        required: false
        default: false
        type: boolean
      consumer:
        description: Package a local preview and execute its isolated JRE17 consumer
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.consumer }}
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        id: consumer_runtime
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Build an immutable local preview and test anonymous file repository consumption
        shell: bash
        env:
          CONSUMER_RUNTIME_HOME: ${{ steps.consumer_runtime.outputs.path }}
        run: |
          bash ./gradlew clean publishCandidate -PspmCoreVersion="1.2.0" --no-build-cache --rerun-tasks --console=plain
          python scripts/package_candidate.py --revision "$GITHUB_SHA" --version "1.2.0"
          python -c 'import hashlib,os,subprocess,sys; from pathlib import Path; p=Path("build/candidate-dist").resolve(); subprocess.run([sys.executable,"scripts/validate_candidate_consumer.py","--repository",p.as_uri(),"--revision",os.environ["GITHUB_SHA"],"--manifest-sha256",hashlib.sha256((p/"manifest.json").read_bytes()).hexdigest(),"--gradle",str(Path("gradlew").resolve()),"--compiler-home",os.environ["JAVA_HOME"],"--runtime-home",os.environ["CONSUMER_RUNTIME_HOME"],"--output","build/consumer-evidence.json"],check=True)'
      - name: Preserve the preview and consumer result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-consumer-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/candidate-dist/
            build/consumer-evidence.json
          if-no-files-found: error
  stability:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stability }}
    uses: ./.github/workflows/core-stability.yml
  candidate:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: java-17-linux-x64
            runner: ubuntu-24.04
            java: '17'
            java_arch: x64
            native_target: ''
          - label: java-21-linux-x64
            runner: ubuntu-24.04
            java: '21'
            java_arch: x64
            native_target: ''
          - label: java-25-linux-x64
            runner: ubuntu-24.04
            java: '25'
            java_arch: x64
            native_target: ''
          - label: native-17-windows-x86
            runner: windows-2025
            java: '17'
            java_arch: x86
            compiler_arch: x64
            native_target: i686-pc-windows-msvc
          - label: native-25-linux-x64
            runner: ubuntu-24.04
            java: '25'
            java_arch: x64
            native_target: x86_64-unknown-linux-gnu
          - label: native-25-linux-arm64
            runner: ubuntu-24.04-arm
            java: '25'
            java_arch: aarch64
            native_target: aarch64-unknown-linux-gnu
          - label: native-25-windows-x64
            runner: windows-2025
            java: '25'
            java_arch: x64
            native_target: x86_64-pc-windows-msvc
          - label: native-25-windows-arm64
            runner: windows-11-arm
            distribution: microsoft
            java: '25'
            java_arch: aarch64
            native_target: aarch64-pc-windows-msvc
          - label: native-25-macos-arm64
            runner: macos-15
            java: '25'
            java_arch: aarch64
            native_target: aarch64-apple-darwin
          - label: native-25-macos-x64
            runner: macos-15-intel
            java: '25'
            java_arch: x64
            native_target: x86_64-apple-darwin
    steps:
      - name: Check out the exact event SHA (PR merge SHA for pull_request)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python for the mandatory audit and evidence checks
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the actual test JDK
        id: test_jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: ${{ matrix.distribution || 'temurin' }}
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.java_arch }}
      - name: Install the compiler JDK (always 25, release target remains 17)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: ${{ matrix.distribution || 'temurin' }}
          java-version: '25'
          architecture: ${{ matrix.compiler_arch || matrix.java_arch }}
      - name: Execute tests, audit and inspect this candidate
        shell: bash
        env:
          SPM_TEST_JAVA_HOME: ${{ steps.test_jdk.outputs.path }}
          SPM_TEST_JAVA: ${{ matrix.java }}
          SPM_NATIVE_TARGET: ${{ matrix.native_target }}
        run: |
          args=(--expected-sha "$GITHUB_SHA" --test-java "$SPM_TEST_JAVA")
          if [[ -n "$SPM_NATIVE_TARGET" ]]; then
            args+=(--native-target "$SPM_NATIVE_TARGET")
          fi
          python scripts/ci_core.py "${args[@]}"
      - name: Measure committed scalar and available native kernels on the actual runner
        if: ${{ matrix.java == '25' }}
        shell: bash
        run: |
          args=()
          target='${{ matrix.native_target }}'
          if [[ -n "$target" ]]; then
            case "$target" in
              *windows*) library=spm_core_native.dll ;;
              *darwin*) library=libspm_core_native.dylib ;;
              *) library=libspm_core_native.so ;;
            esac
            args+=(--native-library "native-rust/target/$target/release/$library")
          fi
          python scripts/measure_baseline.py "${args[@]}" --output .gradle/core-ci/artifact/baseline-metrics.json --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Preserve actual logs, XML and candidate files, including on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.label }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .gradle/core-ci/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  android-arm64:
    name: native-cross-android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Cross-compile and inspect Android ARM64 native shared library
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [[ -z "$NDK" || ! -d "$NDK" ]]; then
            echo "ANDROID_NDK_LATEST_HOME not found on runner" >&2
            exit 1
          fi
          LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          rustup toolchain install 1.98.1 --profile minimal --component clippy --target aarch64-linux-android
          export CARGO_TARGET_DIR="$PWD/native-rust/target"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$LINKER"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$AR"
          cargo +1.98.1 clippy --manifest-path native-rust/Cargo.toml --workspace --locked --target aarch64-linux-android -- -D warnings
          cargo +1.98.1 build --manifest-path native-rust/Cargo.toml --release --locked --target aarch64-linux-android
          LIB="native-rust/target/aarch64-linux-android/release/libspm_core_native.so"
          test -f "$LIB"
          readelf -h "$LIB"
          mkdir -p .gradle/android-ci/artifact
          cp "$LIB" .gradle/android-ci/artifact/libspm_core_native.so
          python -c 'import hashlib,json,os; p=".gradle/android-ci/artifact/libspm_core_native.so"; rec=dict(schema=1,status="CROSS_COMPILED_NOT_EXECUTED",checkout=os.environ["GITHUB_SHA"],runId=os.environ.get("GITHUB_RUN_ID"),runAttempt=os.environ.get("GITHUB_RUN_ATTEMPT"),os="Android",architecture="aarch64",native=dict(target="aarch64-linux-android",crossCompileOnly=True,sha256=hashlib.sha256(open(p,"rb").read()).hexdigest())); open(".gradle/android-ci/artifact/candidate.json","w",encoding="utf-8").write(json.dumps(rec,indent=2)+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-android-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: .gradle/android-ci/artifact/
          if-no-files-found: error
          retention-days: 14

  core-ci:
    name: Core CI
    needs: [candidate, android-arm64]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every candidate row to succeed
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.candidate.result }}
          ANDROID_RESULT: ${{ needs.android-arm64.result }}
        run: test "$MATRIX_RESULT" = success && test "$ANDROID_RESULT" = success
      - name: Check out the same exact SHA to assemble the platform matrix
        if: ${{ always() }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python for the platform matrix helper
        if: ${{ always() }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download every candidate manifest
        if: ${{ always() }}
        # A failed row has no verified manifest, so this can legitimately come back empty. The matrix
        # then records that platform as NOT_EXECUTED instead of assuming success.
        continue-on-error: true
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4
        with:
          pattern: core-*-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
      - name: Assemble the native platform matrix from real manifests
        if: ${{ always() }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          args=()
          for manifest in artifacts/**/candidate.json; do
            args+=(--manifest "$manifest")
          done
          python scripts/platform_matrix.py --output platform-matrix.json "${args[@]}"
      - name: Preserve the platform matrix
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-platform-matrix-${{ github.sha }}-${{ github.run_attempt }}
          path: platform-matrix.json
          if-no-files-found: error
          retention-days: 14
